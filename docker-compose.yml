services:
  toon-exporter:
    image: smbl64/toon-exporter:latest
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-9100}:${LISTEN_PORT:-9100}"
    environment:
      - TOON_ADDR=${TOON_ADDR:-http://eneco.lan}
      - LISTEN_PORT=${LISTEN_PORT:-:9100}
      - READ_TIMEOUT=${READ_TIMEOUT:-10s}
    # If eneco.lan resolves on the host but not inside the container,
    # uncomment network_mode and remove ports (host networking handles it).
    # network_mode: host
